[tool.djlint]
profile = "django"
indent = 2

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
python_files = ["test.py", "tests.py", "test_*.py", "*_test.py"]
addopts = "--doctest-modules --strict-markers"
markers = [
    "slow: Run tests that are slow",
    "fast: Run fast tests",
]
