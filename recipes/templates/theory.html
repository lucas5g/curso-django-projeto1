<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Theory</title>
    </head>
    <body>
        <h1>Theory</h1>
        <p>Qtd. total de receitas: {{ number_of_recipes}}</p>
        <ul>
            {% for recipe in recipes %}
            <!--<li>{{recipe}}</li>-->
            <li>
                {{recipe.id}} {{recipe.author__username}} {{recipe.title}} {{recipe.author_full_name }}
            </li>
            {% empty %}
            <li>No recipes found</li>
            {%endfor %}
        </ul>
    </body>
</html>
